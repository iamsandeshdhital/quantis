[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantis"
version = "1.0.0"
description = "QUANTIS — QUantum Advanced Nanoscale Technology & Information Systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sandesh Dhital" }]
keywords = ["quantum-computing", "error-correction", "quantum-ml", "compilation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
qiskit = ["qiskit>=1.2", "qiskit-aer>=0.15"]
all = ["qiskit>=1.2", "qiskit-aer>=0.15"]

[project.scripts]
qit-run = "qit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
